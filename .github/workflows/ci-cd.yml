name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ismail7caa/job-market-intellegence-platform

jobs:
  # Code Quality & Testing
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            alembic \
            fastapi \
            httpx \
            kafka-python \
            loguru \
            numpy \
            pandas \
            pandera \
            psycopg2-binary \
            pydantic \
            pydantic-settings \
            pytest \
            pytest-cov \
            requests \
            scikit-learn \
            sqlalchemy

      - name: Lint with Pylint
        run: |
          pip install pylint
          pylint src/ --fail-under=7.0 --ignore-imports=yes || true

      - name: Format check with Black
        run: |
          pip install black
          black --check src/ || true

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: |
          pip install pytest pytest-cov pytest-asyncio
          pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Build & Push Docker Image
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to AWS free-tier EC2
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: /home/ubuntu/job-market-intelligence-platform
      APP_IMAGE: ghcr.io/ismail7caa/job-market-intellegence-platform:main
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      - uses: actions/checkout@v3

      - name: Prepare SSH key
        run: |
          test -n "$EC2_HOST" || { echo "EC2_HOST secret is not set"; exit 1; }
          test -n "$EC2_USER" || { echo "EC2_USER secret is not set"; exit 1; }
          test -n "${{ secrets.EC2_SSH_KEY }}" || { echo "EC2_SSH_KEY secret is not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/jmip_deploy_key
          chmod 600 ~/.ssh/jmip_deploy_key

      - name: Copy free-tier compose file
        run: |
          ssh -i ~/.ssh/jmip_deploy_key -p "$EC2_PORT" -o StrictHostKeyChecking=accept-new "$EC2_USER@$EC2_HOST" "mkdir -p ${APP_DIR}/database"
          scp -i ~/.ssh/jmip_deploy_key -P "$EC2_PORT" -o StrictHostKeyChecking=accept-new docker-compose.free-tier.yml "$EC2_USER@$EC2_HOST:${APP_DIR}/docker-compose.free-tier.yml"
          scp -i ~/.ssh/jmip_deploy_key -P "$EC2_PORT" -o StrictHostKeyChecking=accept-new database/init.sql "$EC2_USER@$EC2_HOST:${APP_DIR}/database/init.sql"

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/jmip_deploy_key -p "$EC2_PORT" -o StrictHostKeyChecking=accept-new "$EC2_USER@$EC2_HOST" <<EOF
          set -e
          cd ${APP_DIR}

          cat > .env <<ENVEOF
          APP_IMAGE=${APP_IMAGE}
          DB_USER=jobmarket
          DB_PASSWORD=${{ secrets.EC2_DB_PASSWORD }}
          DB_NAME=job_market
          DEBUG=false
          LOG_LEVEL=INFO
          MARKET_REGION=Germany
          DEFAULT_CURRENCY=EUR
          ENVEOF

          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose -f docker-compose.free-tier.yml pull
          docker compose -f docker-compose.free-tier.yml up -d --remove-orphans
          docker image prune -f
          EOF

      - name: Notify deployment
        if: success()
        run: |
          echo "Deployment successful on AWS free-tier EC2"
