version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jmip_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-jobmarket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: ${DB_NAME:-job_market}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jobmarket}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jmip_app
    environment:
      DATABASE_URL: postgresql://${DB_USER:-jobmarket}:${DB_PASSWORD:-dev_password}@postgres:5432/${DB_NAME:-job_market}
      DEBUG: "true"
      LOG_LEVEL: INFO
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LINKEDIN_API_KEY: ${LINKEDIN_API_KEY:-}
      KAGGLE_API_KEY: ${KAGGLE_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: jmip_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: jmip_network
