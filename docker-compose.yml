version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jmip_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-jobmarket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: ${DB_NAME:-job_market}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jobmarket}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper for Kafka
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: jmip_zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: yes
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/bitnami/zookeeper

  # Kafka
  kafka:
    image: bitnami/kafka:3.5
    container_name: jmip_kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: yes
    ports:
      - "9092:9092"
      - "9094:9094"
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/bitnami/kafka

  # Airflow Init
  airflow-init:
    image: apache/airflow:2.7.3
    container_name: jmip_airflow_init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${DB_USER:-jobmarket}:${DB_PASSWORD:-dev_password}@postgres:5432/${DB_NAME:-job_market}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    command: airflow db migrate
    depends_on:
      postgres:
        condition: service_healthy

  # Airflow Webserver
  airflow-webserver:
    image: apache/airflow:2.7.3
    container_name: jmip_airflow_webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${DB_USER:-jobmarket}:${DB_PASSWORD:-dev_password}@postgres:5432/${DB_NAME:-job_market}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    command: airflow webserver
    depends_on:
      - airflow-init

  # Airflow Scheduler
  airflow-scheduler:
    image: apache/airflow:2.7.3
    container_name: jmip_airflow_scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${DB_USER:-jobmarket}:${DB_PASSWORD:-dev_password}@postgres:5432/${DB_NAME:-job_market}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    command: airflow scheduler
    depends_on:
      - airflow-init

  # Kafka Consumer
  kafka-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jmip_kafka_consumer
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/service-account.json
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BIGQUERY_PROJECT: your-gcp-project-id
      BIGQUERY_DATASET: bronze
    depends_on:
      kafka:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./service-account.json:/app/service-account.json
    command: python -m src.data_pipeline.kafka_consumer
    restart: unless-stopped

  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jmip_app
    environment:
      DATABASE_URL: postgresql://${DB_USER:-jobmarket}:${DB_PASSWORD:-dev_password}@postgres:5432/${DB_NAME:-job_market}
      DEBUG: "true"
      LOG_LEVEL: INFO
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LINKEDIN_API_KEY: ${LINKEDIN_API_KEY:-}
      KAGGLE_API_KEY: ${KAGGLE_API_KEY:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./job-intelligence:/app/job-intelligence:ro
      - ./data:/app/data
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: jmip_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:

networks:
  default:
    name: jmip_network
