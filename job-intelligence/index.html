<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>German Job Market Intelligence</title>
  <link rel="stylesheet" href="/job-intelligence/css/base.css">
  <link rel="stylesheet" href="/job-intelligence/css/search.css">
</head>
<body class="search-page">
  <header class="site-header">
    <a class="brand" href="/" aria-label="German Job Market Intelligence">
      <span class="brand-mark">DE</span>
      <span>Job Market Intelligence</span>
    </a>
    <nav class="header-nav" aria-label="Primary">
      <a href="/data/governance">Data policy</a>
      <a href="/ready">Readiness</a>
      <a href="/docs">API</a>
    </nav>
  </header>

  <main class="search-shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Germany-wide job search</p>
      <h1 id="page-title">Find your next job in Germany faster.</h1>
      <p class="hero-copy">
        Search across roles and cities, compare salary signals, and open the right application page in one focused flow.
      </p>
    </section>

    <section class="search-panel" aria-label="Search jobs">
      <form id="search-form" class="search-form">
        <label class="field field-query">
          <span>Role, company, skill, or profession</span>
          <input id="query" name="q" type="search" autocomplete="off" placeholder="Pflege, Buchhaltung, Sales Manager">
        </label>
        <label class="field">
          <span>Location</span>
          <input id="location" name="location" type="search" autocomplete="off" placeholder="Germany, Berlin, Hamburg">
        </label>
        <button class="primary-action" type="submit">Search jobs</button>
      </form>

      <div class="quick-searches" aria-label="Fast searches">
        <button type="button" data-query="Pflege">Pflege</button>
        <button type="button" data-query="Buchhaltung">Buchhaltung</button>
        <button type="button" data-query="Logistik">Logistik</button>
        <button type="button" data-query="Sales Manager">Sales Manager</button>
        <button type="button" data-query="Data Analyst">Data Analyst</button>
      </div>
      <div id="search-status" class="status-message" hidden></div>
    </section>
  </main>

  <script src="/job-intelligence/js/api.js" defer></script>
  <script src="/job-intelligence/js/search.js" defer></script>
</body>
</html>
