<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobs in Deutschland | Job Market Intelligence</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/search.css">
</head>
<body class="search-page">
  <header class="site-header">
    <a class="brand" href="./" aria-label="German Job Market Intelligence">
      <span class="brand-mark">DE</span>
      <span>Job Market Intelligence</span>
    </a>
    <div class="header-signal" aria-label="Market focus">Deutschland</div>
  </header>

  <main class="search-shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Jobsuche in Deutschland</p>
      <h1 id="page-title">Finden Sie schneller den passenden Job.</h1>
      <p class="hero-copy">
        Eine klare Suche fuer passende Stellen, Gehaltskontext und den direkten Weg zur Bewerbung.
      </p>
    </section>

    <section class="search-panel" aria-label="Jobs suchen">
      <form id="search-form" class="search-form">
        <label class="field field-query">
          <span>Beruf, Unternehmen oder Kompetenz</span>
          <input id="query" name="q" type="search" autocomplete="off" placeholder="Pflege, Buchhaltung, Logistik, Vertrieb">
          <div id="suggestions" class="suggestions" hidden></div>
        </label>
        <label class="field">
          <span>Ort</span>
          <input id="location" name="location" type="search" autocomplete="off" placeholder="Deutschland, Berlin, Hamburg">
        </label>
        <button class="primary-action" type="submit">Jobs suchen</button>
      </form>

      <div class="quick-searches" aria-label="Schnellsuchen">
        <button type="button" data-query="Pflege">Pflege</button>
        <button type="button" data-query="Buchhaltung">Buchhaltung</button>
        <button type="button" data-query="Logistik">Logistik</button>
        <button type="button" data-query="Vertrieb">Vertrieb</button>
        <button type="button" data-query="Ingenieurwesen">Ingenieurwesen</button>
      </div>
      <div id="search-status" class="status-message" hidden></div>
    </section>
  </main>

  <script src="js/api.js" defer></script>
  <script src="js/search.js" defer></script>
</body>
</html>
