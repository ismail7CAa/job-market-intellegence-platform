apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: default
data:
  init.sql: |
    -- Create database tables
    CREATE TABLE IF NOT EXISTS job_postings (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      title VARCHAR(255) NOT NULL,
      company VARCHAR(255) NOT NULL,
      location VARCHAR(255),
      salary_min INTEGER,
      salary_max INTEGER,
      job_type VARCHAR(50),
      description TEXT,
      source VARCHAR(50),
      url TEXT,
      posted_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      UNIQUE(title, company, location)
    );

    CREATE TABLE IF NOT EXISTS skills (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      name VARCHAR(100) UNIQUE NOT NULL,
      category VARCHAR(100),
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS job_skills (
      job_id UUID REFERENCES job_postings(id) ON DELETE CASCADE,
      skill_id UUID REFERENCES skills(id) ON DELETE CASCADE,
      PRIMARY KEY (job_id, skill_id)
    );

    CREATE TABLE IF NOT EXISTS skill_trends (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      skill_id UUID REFERENCES skills(id) ON DELETE CASCADE,
      month DATE,
      occurrences INTEGER DEFAULT 0,
      salary_premium FLOAT,
      trend_percentage FLOAT,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS salary_data (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      role VARCHAR(255),
      location VARCHAR(255),
      min_salary INTEGER,
      max_salary INTEGER,
      median_salary INTEGER,
      sample_size INTEGER,
      currency VARCHAR(10) DEFAULT 'USD',
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS market_forecasts (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      role VARCHAR(255),
      confidence_score FLOAT,
      predicted_growth FLOAT,
      forecast_date DATE,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS pipeline_logs (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      source VARCHAR(50),
      status VARCHAR(50),
      job_count INTEGER DEFAULT 0,
      error_message TEXT,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Create indexes
    CREATE INDEX IF NOT EXISTS idx_job_title ON job_postings(title);
    CREATE INDEX IF NOT EXISTS idx_job_company ON job_postings(company);
    CREATE INDEX IF NOT EXISTS idx_job_location ON job_postings(location);
    CREATE INDEX IF NOT EXISTS idx_job_posted_date ON job_postings(posted_date);
    CREATE INDEX IF NOT EXISTS idx_skill_trends_month ON skill_trends(month);
    CREATE INDEX IF NOT EXISTS idx_salary_role_location ON salary_data(role, location);
    CREATE INDEX IF NOT EXISTS idx_market_forecast_role ON market_forecasts(role);
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: default
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: database-name
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $(POSTGRES_USER)
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $(POSTGRES_USER)
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-script
          configMap:
            name: postgres-init-script
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
