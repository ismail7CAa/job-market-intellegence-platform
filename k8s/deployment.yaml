apiVersion: v1
kind: ConfigMap
metadata:
  name: jmip-config
  namespace: default
data:
  LOG_LEVEL: "INFO"
  DEBUG: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: jmip-secrets
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres:5432/job_market"
  LINKEDIN_API_KEY: ""
  KAGGLE_API_KEY: ""
---
apiVersion: v1
kind: Service
metadata:
  name: jmip-service
  namespace: default
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: jmip
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jmip-app
  namespace: default
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: jmip
  template:
    metadata:
      labels:
        app: jmip
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: jmip
          image: ghcr.io/user/job-market-intelligence-platform:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jmip-config
            - secretRef:
                name: jmip-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - jmip
                topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jmip-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jmip-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jmip-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: jmip
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jmip-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: jmip
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 443   # HTTPS
